<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA线上载具数据整合库</title>
    <!-- 只保留Tailwind，删掉不存在的style.css引用 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-6">
        <h1 class="text-3xl font-bold mb-6 text-center">GTA线上载具数据整合库</h1>

        <!-- 筛选栏 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
            <input 
                id="searchInput" 
                type="text" 
                placeholder="输入载具名称搜索..." 
                class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white outline-none"
            >
            <select id="typeSelect" 
                class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white outline-none"
            >
                <option value="">全部类型</option>
                <option value="super">超级跑车</option>
                <option value="sports">跑车</option>
            </select>
        <select
            id="sortSelect"
            class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-white outline-none"
        >
            <option value="default">默认排序</option>
            <option value="price-desc">价格升序</option>
            <option value="price-asc">价格降序</option>
            <option value="topspeed-desc">最高速度从快到慢</option>
			<option value="topspeed-asc">最高速度从慢到快</option>
            <option value="ccgp-asc">CCGP圈速 由快到慢</option>
            <option value="ccgp-desc">CCGP圈速 由慢到快</option>
            <option value="mountain-asc">山道之王 由快到慢</option>
            <option value="mountain-desc">山道之王 由慢到快</option>
        </select>

        </div>

        <button 
            id="openCompareBtn" 
            class="w-full sm:w-auto px-6 py-2 mb-6 bg-blue-600 hover:bg-blue-500 text-white rounded"
        >
            打开对比面板
        </button>

        <!-- 车辆列表 -->
        <div 
            id="vehicleList" 
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
        >
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div 
        id="carDetailModal" 
        class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4"
    >
        <div class="bg-slate-800 max-w-2xl w-full max-h-[90vh] overflow-y-auto rounded-lg p-6 relative">
            <button 
                id="closeDetailBtn" 
                class="absolute top-3 right-3 text-2xl text-gray-400 hover:text-white"
            >
                ×
            </button>
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- 对比弹窗 -->
    <div 
        id="compareModal" 
        class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4"
    >
        <div class="bg-slate-800 max-w-4xl w-full max-h-[90vh] overflow-y-auto rounded-lg p-6 relative">
            <button 
                id="closeCompareBtn" 
                class="absolute top-3 right-3 text-2xl text-gray-400 hover:text-white"
            >
                ×
            </button>
            <div id="compareContent"></div>
        </div>
    </div>

    <!-- ✅ 全部改成大写 ./JS/ 和你仓库文件夹名完全一致 -->
    <script src="./JS/main.js"></script>
    <script src="./JS/filter.js"></script>
    <script src="./JS/compare.js"></script>
</body>
</html>
